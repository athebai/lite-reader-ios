workflows:
  ios-build-unsigned-ipa:
    name: Build unsigned IPA (iOS 12.0)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.4
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned (iphoneos, Release)
        script: |
          set -e
          xcodebuild \
            -project LiteReader.xcodeproj \
            -scheme LiteReader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          set -e
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/LiteReader.app" Payload/
          zip -ry LiteReader-unsigned.ipa Payload
          ls -la LiteReader-unsigned.ipa
          file Payload/LiteReader.app/LiteReader
    artifacts:
      - LiteReader-unsigned.ipa
